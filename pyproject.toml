[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[project]
name = "filmtagger"
version = "0.3.0"
description = "A simple CLI to tag film scans with EXIF metadata"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["film", "photography", "exif", "metadata"]
authors = [
    { name = "Scott Johnston", email = "sjohnston@alum.mit.edu" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "click>=8.0.0",
    "tomli>=1.2.0",
    "rapidfuzz>=3.0.0",
    "python-dateutil>=2.8.0",
    "pyexiv2>=2.8.0",
]

[project.urls]
Homepage = "https://github.com/2n3906/filmtagger"
Repository = "https://github.com/2n3906/filmtagger.git"
Issues = "https://github.com/2n3906/filmtagger/issues"

[project.scripts]
filmtagger = "filmtagger.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.uv.build-backend]
module-root = "src"

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "B",
    "C",
    "DTZ",
    "E",
    "EM",
    "F",
    "FBT",
    "I",
    "ICN",
    "ISC",
    "N",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "Q",
    "RUF",
    "S",
    "T",
    "TID",
    "UP",
    "W",
    "YTT",
]
ignore = [
    "PLR0913",  # Too many arguments to function call
    "PLR0917",  # Too many positional arguments
    "S101",     # Use of assert detected
    "C901",     # Function is too complex
    "PLR0912",  # Too many branches
    "PLR0915",  # Too many statements
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.coverage.run]
source_pkgs = ["filmtagger", "tests"]
branch = true
parallel = true

[tool.coverage.paths]
filmtagger = ["src/filmtagger", "*/filmtagger/src/filmtagger"]
tests = ["tests", "*/filmtagger/tests"]

[tool.coverage.report]
exclude_lines = [
    "no cov",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.pytest.ini_options]
testpaths = ["tests"]